<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma de Valuation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Plataforma de Valuation</h1>
  <div class="actions">
    <button id="btnJson">Baixar JSON</button>
    <button id="btnXlsx">Baixar Excel</button>
    <button id="btnImport">Subir JSON</button>
    <input type="file" id="fileJson" accept=".json,application/json" hidden>
  </div>
</header>
<div class="layout">
  <aside>
    <h2>Ações</h2>
    <ul id="stockList"></ul>
    <button id="btnAdd" class="full">Adicionar ação</button>
    <p class="hint">Ações vindas de um JSON aparecem com a etiqueta “JSON”. As novas ficam sem etiqueta.</p>
  </aside>
  <main>
    <section class="panel controls">
      <label>Método
        <select id="method">
          <option value="todos">Todos de uma vez</option>
          <option value="bazin">1. Bazin (histórico)</option>
          <option value="dyproj">2. DY projetivo</option>
          <option value="roe">3. ROE projetivo</option>
          <option value="peg">4. PEG Ratio</option>
          <option value="longo">5. Longo prazo (15 anos)</option>
        </select>
      </label>
      <label>Janela do histórico (Bazin)
        <select id="win"><option value="3">3 anos</option><option value="5" selected>5 anos</option></select>
      </label>
      <label class="check"><input type="checkbox" id="reuse" checked> Reaproveitar métricas entre módulos</label>
    </section>
    <section class="panel">
      <div class="row-head">
        <h2>O que preencher</h2>
        <div><button id="btnFetch">Buscar no Investidor10</button> <span id="status" class="status"></span></div>
      </div>
      <div id="form" class="grid"></div>
    </section>
    <section id="results"></section>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="script.js"></script>
</body>
</html>
